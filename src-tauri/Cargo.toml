[package]
name = "zuno"
version = "1.4.0"
description = "Zuno - a desktop music client"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zuno_lib"
# Tauri desktop and mobile builds need the cdylib output; staticlib and rlib
# remain enabled for the native test and link paths.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-localhost = "2"
tauri-plugin-single-instance = "2"
portpicker = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "stream"] }
base64 = "0.23"
url = "2.5"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
discord-rich-presence = "1.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
md5 = "0.8.0"
lofty = "0.25.3"
notify = "8.2.0"
futures-util = "0.3.33"
# Already in the tree via tauri; declared directly for `sleep` in the range-retry backoff
# and the semaphore that serialises playback fills.
tokio = { version = "1", features = ["sync", "time"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-all"] }
# Demuxing only. rodio 0.23 still pins symphonia 0.5, so this line no longer lets the two
# share one copy — the binary carries both the rodio-side 0.5 and this 0.6, Matroska and Ogg
# readers twice over. That is the price of the 0.6 bump until rodio moves with it, and the
# two copies are independent: rodio's stays internal to rodio, and only the Matroska/Ogg
# demuxing done here goes through 0.6.
symphonia = { version = "0.6", default-features = false, features = ["mkv", "ogg"] }
# libopus, built from source via cmake. symphonia has no Opus decoder at all, and YouTube
# serves Opus-in-WebM for the large majority of tracks at `high` — and as the *only* audio
# offered for many of them, so preferring AAC is not an alternative.
opus = "0.4.0"
# Was macOS-only (the session encryption key); account slot ids need it on every platform now.
rand = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
aes-gcm = "0.11"
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSDictionary", "NSGeometry", "NSObject", "NSString", "NSValue", "objc2-core-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Foundation",
  "Media",
  "Media_Playback",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = "0.9"
