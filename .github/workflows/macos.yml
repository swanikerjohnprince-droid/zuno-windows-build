name: Build Zuno DJ for macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Apple Silicon (arm64)
            runner: macos-26
            target: aarch64-apple-darwin
          - arch: Intel (x86_64)
            runner: macos-26-intel
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install native build tools
        run: brew install cmake pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Zuno DJ
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles dmg

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: Zuno-DJ-macOS-${{ matrix.arch == 'Apple Silicon (arm64)' && 'Apple-Silicon' || 'Intel' }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
