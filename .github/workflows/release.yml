name: Build Zuno for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Zuno
        run: npm run tauri build -- --bundles nsis

      - name: Find Windows executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No executable was produced."
            exit 1
          }
          Write-Host "Found executable: $($exe.FullName)"
          "EXE_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Zuno-Windows
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Verify Android NDK
        run: |
          echo "Using Android NDK: $ANDROID_NDK_HOME"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Tauri Android project
        run: npm run tauri android init

      - name: Verify Tauri Android minimum SDK
        run: |
          grep -n "minSdk" src-tauri/gen/android/app/build.gradle.kts
          test "$(grep -o 'minSdk = [0-9]*' src-tauri/gen/android/app/build.gradle.kts | head -1 | grep -o '[0-9]*')" = "26"

      - name: Build Android APK
        run: npm run tauri android build -- --apk

      # Sign the release APK so Android can install it. If the persistent keystore
      # secrets are configured, the same key is reused across releases. Otherwise,
      # a throwaway key makes the APK installable but requires uninstalling an older
      # build before installing a new one.
      - name: Sign Android APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          OUT_DIR=src-tauri/gen/android/app/build/outputs/apk
          UNSIGNED="$(find "$OUT_DIR" -type f -name '*-unsigned.apk' | head -1)"
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED="$(find "$OUT_DIR" -type f -name '*release*.apk' | head -1)"
          fi
          test -n "$UNSIGNED"
          echo "Signing: $UNSIGNED"

          KEYSTORE="$RUNNER_TEMP/zuno.keystore"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set - signing with a throwaway key. Updates will not install over a previous build."
            KEYSTORE_PASSWORD="zunothrowaway"
            KEY_ALIAS="zuno"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            keytool -genkeypair -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Zuno DJ"
          fi

          mkdir -p signed
          "$BT/zipalign" -f -p 4 "$UNSIGNED" signed/aligned.apk
          "$BT/apksigner" sign --ks "$KEYSTORE" --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" \
            --out signed/Zuno-DJ-Android.apk signed/aligned.apk
          rm signed/aligned.apk
          "$BT/apksigner" verify --print-certs signed/Zuno-DJ-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Zuno-Android
          path: signed/Zuno-DJ-Android.apk
          if-no-files-found: error

  publish-release:
    name: Publish Windows and Android release assets
    runs-on: ubuntu-22.04
    needs: [build-windows, build-android]

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: Zuno-Windows
          path: release/windows

      - name: Download Android build
        uses: actions/download-artifact@v4
        with:
          name: Zuno-Android
          path: release/android

      - name: Prepare release assets
        run: |
          set -e
          mkdir -p release-assets
          windows_exe="$(find release/windows -type f -name '*.exe' | head -1)"
          android_apk="$(find release/android -type f -name '*.apk' | head -1)"
          test -n "$windows_exe"
          test -n "$android_apk"
          cp "$windows_exe" release-assets/Zuno-DJ-Windows.exe
          cp "$android_apk" release-assets/Zuno-DJ-Android.apk
          ls -lh release-assets

      - name: Upload assets to v1.4.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.4.0 release-assets/Zuno-DJ-Windows.exe release-assets/Zuno-DJ-Android.apk --repo "${{ github.repository }}" --clobber

# DJ patch build trigger
