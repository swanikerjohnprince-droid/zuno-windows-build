name: Build Zuno for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare Tauri signing
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            @'
          {
            "bundle": {
              "createUpdaterArtifacts": false
            }
          }
          '@ | Set-Content -Path "tauri.build.json"
            "TAURI_BUILD_CONFIG=tauri.build.json" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "No Tauri signing key configured; updater artifacts will be disabled for this build."
          } else {
            Write-Host "Tauri signing key is configured; updater artifacts will be signed."
          }

      - name: Build Zuno
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ($env:TAURI_BUILD_CONFIG) {
            npm run tauri build -- --bundles nsis --config $env:TAURI_BUILD_CONFIG
          } else {
            npm run tauri build -- --bundles nsis
          }

      - name: Find Windows executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No executable was produced."
            exit 1
          }
          Write-Host "Found executable: $($exe.FullName)"
          "EXE_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Zuno-Windows
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
