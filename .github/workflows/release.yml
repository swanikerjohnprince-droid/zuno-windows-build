name: Build Zuno for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Zuno
        run: npm run tauri build -- --bundles nsis

      - name: Find Windows executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No executable was produced."
            exit 1
          }
          Write-Host "Found executable: $($exe.FullName)"
          "EXE_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Zuno-Windows
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error


  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Tauri Android project
        run: npm run tauri android init

      - name: Build Android APK
        run: npm run tauri android build -- --apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Zuno-Android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
